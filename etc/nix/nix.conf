# Nix Global Configuration
# Place this file at /etc/nix/nix.conf for system-wide settings

# Enable experimental features for flakes and nix-command
experimental-features = nix-command flakes

# Accept flake configuration automatically
accept-flake-config = true

# Use the official flake registry
flake-registry = https://github.com/NixOS/flake-registry/raw/master/flake-registry.json

# Performance optimizations
auto-optimise-store = true

# Keep outputs and derivations for remote development
keep-outputs = true
keep-derivations = true

# Substituters (binary caches)
substituters = https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

# Build settings
max-jobs = auto
cores = 0
